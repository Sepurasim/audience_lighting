<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Stadium Light – Zone wählen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #setup {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0a0a0a;
      z-index: 100;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      text-align: center;
    }
    p.sub {
      color: #888;
      margin-bottom: 28px;
      text-align: center;
      font-size: 0.95rem;
    }

    .zone-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }

    .zone-btn {
      background: #1a1a1a;
      border: 2px solid #333;
      color: #fff;
      padding: 18px 10px;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .zone-btn:active, .zone-btn.selected {
      background: #2a2a2a;
      border-color: #0af;
      transform: scale(0.97);
    }

    #startBtn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      background: #0af;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
    }
    #startBtn.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Fullscreen stage */
    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 50;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      z-index: 60;
      pointer-events: none;
    }

    #exitBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 60;
      opacity: 0.3;
    }
    #exitBtn:active { opacity: 1; }

    /* Strobe animation handled by JS for precise control */
  </style>
</head>
<body>
  <div id="setup">
    <h1>Stadium Light</h1>
    <p class="sub">Wähle ungefähr deinen Standort / Sektor</p>

    <div class="zone-grid" id="zoneGrid">
      <!-- buttons generated by JS -->
    </div>

    <button id="startBtn">Fullscreen starten</button>
  </div>

  <div id="stage">
    <div id="status">Zone – · offline</div>
    <button id="exitBtn">Beenden</button>
  </div>

  <script>
    const NUM_ZONES = 10;
    let selectedZone = null;
    let ws = null;
    let current = { dimmer: 0, r: 0, g: 0, b: 0, w: 0, strobe: 0 };
    let strobeInterval = null;
    let strobeOn = true;
    let wakeLock = null;

    // Build zone buttons
    const grid = document.getElementById('zoneGrid');
    for (let i = 1; i <= NUM_ZONES; i++) {
      const btn = document.createElement('button');
      btn.className = 'zone-btn';
      btn.textContent = `Zone ${i}`;
      btn.dataset.zone = i;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedZone = i;
        document.getElementById('startBtn').classList.add('active');
      });
      grid.appendChild(btn);
    }

    const startBtn = document.getElementById('startBtn');
    const stage = document.getElementById('stage');
    const setup = document.getElementById('setup');
    const statusEl = document.getElementById('status');
    const exitBtn = document.getElementById('exitBtn');

    startBtn.addEventListener('click', async () => {
      if (!selectedZone) return;

      // Request fullscreen
      try {
        await document.documentElement.requestFullscreen();
      } catch (e) {
        console.warn('Fullscreen failed', e);
      }

      // Wake Lock
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}

      setup.style.display = 'none';
      stage.style.display = 'block';
      connect();
    });

    exitBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      location.reload();
    });

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${location.host}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'registerAudience', zoneId: selectedZone }));
        statusEl.textContent = `Zone ${selectedZone} · verbunden`;
      };

      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'zoneUpdate' && msg.zoneId === selectedZone) {
            current = {
              dimmer: msg.dimmer,
              r: msg.r,
              g: msg.g,
              b: msg.b,
              w: msg.w,
              strobe: msg.strobe
            };
            applyColor();
            updateStrobe();
          }
        } catch {}
      };

      ws.onclose = () => {
        statusEl.textContent = `Zone ${selectedZone} · offline – reconnect…`;
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function applyColor() {
      // Combine RGBW with dimmer (simple additive white)
      const d = current.dimmer / 255;
      const r = Math.round(current.r * d);
      const g = Math.round(current.g * d);
      const b = Math.round(current.b * d);
      // White channel adds to all (rough approximation)
      const wAdd = Math.round(current.w * d * 0.7);
      const finalR = Math.min(255, r + wAdd);
      const finalG = Math.min(255, g + wAdd);
      const finalB = Math.min(255, b + wAdd);

      if (current.strobe === 0) {
        stage.style.backgroundColor = `rgb(${finalR},${finalG},${finalB})`;
      } else {
        // Strobe handled in interval – keep base color ready
        stage.dataset.base = `rgb(${finalR},${finalG},${finalB})`;
      }
    }

    function updateStrobe() {
      if (strobeInterval) {
        clearInterval(strobeInterval);
        strobeInterval = null;
      }

      if (current.strobe === 0) {
        strobeOn = true;
        applyColor();
        return;
      }

      // Strobe speed: higher value = faster. Map 1-255 → interval ~ 400ms → 30ms
      const interval = Math.max(30, 420 - (current.strobe * 1.5));

      strobeInterval = setInterval(() => {
        strobeOn = !strobeOn;
        if (strobeOn) {
          stage.style.backgroundColor = stage.dataset.base || '#fff';
        } else {
          stage.style.backgroundColor = '#000';
        }
      }, interval);
    }

    // Prevent accidental zoom / scroll
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => {
      if (stage.style.display === 'block') e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
